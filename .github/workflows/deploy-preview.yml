name: Deploy Preview

on:
  push:
    branches: [preview]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npx astro build

      - uses: peaceiris/actions-gh-pages@v3
        with:
          deploy_key: ${{ secrets.PREVIEW_DEPLOY_KEY }}
          external_repository: inusuallabs/web-preview
          publish_branch: gh-pages
          publish_dir: ./dist
          cname: preview.inusual-labs.com
